# Downloads the study copy and deploys it to Cloudflare Pages.
# The original site's files are fetched during the run and never committed.
# Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see README).
name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-ueqx9u, main]
  schedule:
    - cron: '0 3 * * 1' # every Monday: pick up updates from the original

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

env:
  PROJECT_NAME: ${{ vars.CF_PAGES_PROJECT || 'system-design-study' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download the site
        run: node scripts/mirror.mjs

      - name: Keep it out of search engines
        run: |
          printf '/*\n  X-Robots-Tag: noindex, nofollow\n' > site/_headers
          printf 'User-agent: *\nDisallow: /\n' > site/robots.txt

      - name: Create the Pages project (first run only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages project create "$PROJECT_NAME" --production-branch=main || true

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy site --project-name="$PROJECT_NAME" --branch=main --commit-dirty=true
